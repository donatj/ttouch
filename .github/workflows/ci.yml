on: [ push, pull_request ]
name: CI
jobs:
  test:
    strategy:
      matrix:
        platform: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: make build

      - name: Test
        run: make test
